name: Build VST3

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core + processor tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libcurl4-openssl-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Core tests (scale-safety, determinism, MIDI, tools)
        run: ctest --test-dir build --output-on-failure
      - name: Processor tests (headless)
        run: xvfb-run -a build/plugin/HipHopProcessorTest_artefacts/Release/HipHopProcessorTest
      - name: Python dataset tools smoke test
        run: python3 -I -m unittest discover -s tools/dataset/tests -v

  macos:
    name: VST3 macOS (universal arm64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify universal binary
        run: lipo -info "build/plugin/HipHopMidiGenerator_artefacts/Release/VST3/HipHop MIDI Generator.vst3/Contents/MacOS/HipHop MIDI Generator"
      - name: Ad-hoc sign (replace with your Developer ID + notarization for distribution)
        run: codesign --force --deep -s - "build/plugin/HipHopMidiGenerator_artefacts/Release/VST3/HipHop MIDI Generator.vst3"
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/plugin/HipHopMidiGenerator_artefacts/Release/VST3/HipHop MIDI Generator.vst3" dist/HipHopMidiGenerator-macOS-VST3.zip
      - uses: actions/upload-artifact@v4
        with: { name: HipHopMidiGenerator-macOS-VST3, path: dist/*.zip }

  windows:
    name: VST3 Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/plugin/HipHopMidiGenerator_artefacts/Release/VST3/HipHop MIDI Generator.vst3" -DestinationPath dist/HipHopMidiGenerator-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with: { name: HipHopMidiGenerator-Windows-VST3, path: dist/*.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*.zip }
