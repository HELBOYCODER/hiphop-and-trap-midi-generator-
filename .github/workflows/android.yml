name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", "core/**", "data/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK pieces (runner image already has the SDK; accept licences, add NDK + CMake)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Native engine tests (same C++ the app uses)
        run: |
          g++ -std=c++17 -O1 -Icore/include core/src/*.cpp tests/test_core.cpp -o /tmp/hhmg_tests
          /tmp/hhmg_tests
      - name: Build
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/HipHopMidiStudio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HipHopMidiStudio-Android-APK
          path: dist/HipHopMidiStudio-debug.apk
